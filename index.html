<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5ead6">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
color-scheme:light;--bg:#f5ead6;--card:#fdf6e9;--ink:#4a3f35;--mute:#8c7e70;--line:#eadfce;
--water:#8cc4e0;--ex:#f4a893;--med:#bfaee6;--lang:#f2c97a;--veg:#a3d1ac;--per:#eba3b8;}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",-apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:20px 16px 100px}
h1{font-size:30px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
.date{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.head{display:flex;align-items:center;gap:12px}
.ico{width:64px;height:64px;border-radius:18px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;overflow:hidden}
.ban{display:block;width:100%;height:auto;margin-bottom:12px}
.ico img{width:100%;height:100%;object-fit:contain;padding:3px}
.ring{width:52px;height:52px;flex:none;margin-left:auto}
.ring circle{fill:none;stroke-width:7}
.ring .t{stroke:var(--line)}
.ring .p{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{font-size:13px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.title{font-weight:600;font-size:18px}
.val{color:var(--mute);font-size:14px;margin-top:2px}
.val b{color:var(--ink);font-size:18px}
.gl{border:0;background:none;color:var(--mute);font:inherit;font-family:inherit;padding:0;text-decoration:underline dotted}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button.b{flex:1;min-width:64px;padding:11px 8px;border-radius:14px;border:0;background:var(--c);color:#3b3128;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}
button.b:active{filter:brightness(.92)}
button.b.u{background:var(--line);color:var(--mute);flex:0 0 auto;min-width:48px}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mute);font-size:14px}
.sub b{color:var(--ink)}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:16px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
nav button{flex:1;max-width:160px;padding:12px 6px;border-radius:14px;border:0;background:transparent;color:var(--mute);font-weight:600;font-size:15px;font-family:inherit}
nav button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.wk{display:flex;gap:8px;align-items:flex-end;height:90px;margin-top:12px}
.wk div{flex:1;text-align:center;font-size:12px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.wk i{display:block;background:var(--c);border-radius:6px 6px 3px 3px;min-height:4px}
.wk .z i{background:var(--line)}
.wk span{margin-top:4px}
.hide{display:none}
.hint{color:var(--mute);font-size:13px;text-align:center;margin-top:8px}
.banner{border-radius:22px;padding:16px;margin-bottom:14px;background:var(--lang);color:#3b3128}
.banner{text-align:center}
.fin{display:block;margin:0 auto 10px;max-width:230px;max-height:170px;width:auto;height:auto}
.banner b{font-size:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px;color:#3b3128}
.days{display:flex;gap:6px;margin-top:12px}
.days div{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.days em{display:flex;align-items:center;justify-content:center;height:40px;border-radius:12px;background:var(--line);font-style:normal;font-size:15px;color:var(--ink);margin-bottom:4px}
.days .ok em{background:var(--veg)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:inherit;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px}.row>div{flex:1}
.hi{height:44px;width:auto;max-width:70px;object-fit:contain}
.hb{height:40px;width:auto;max-width:140px;object-fit:contain}
details{border-top:1px solid var(--line);padding:10px 0}
summary{font-weight:600;font-size:16px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .w{text-align:center;font-size:12px;color:var(--mute)}
.cal button{aspect-ratio:1;border:2px solid transparent;border-radius:12px;background:transparent;color:var(--ink);font:inherit;font-family:inherit;font-size:15px;position:relative;padding:0}
.cal button.p{background:var(--per);color:#4a2a35;font-weight:700}
.cal button.pr{border:2px dashed var(--per)}
.cal button.td{box-shadow:inset 0 0 0 2px var(--mute)}
.cal button.sel{border-color:var(--ink)}
.cal button.n::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ink)}
.cmh{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-weight:600}
.cmh button{border:0;background:var(--line);color:var(--ink);border-radius:12px;width:44px;height:40px;font-size:20px;font-family:inherit}
.ent{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.ent small{color:var(--mute);display:block;margin-top:2px;white-space:pre-wrap}
.ent button{float:right;border:0;background:none;color:var(--mute);font-size:18px}
</style>
</head>
<body>
<main>
<h1 id="hi">Today</h1>
<p class="date" id="dt"></p>
<section id="p-today"></section>
<section id="p-week" class="hide"></section>
<section id="p-period" class="hide"></section>
<p class="hint" id="hint">Tap a goal to change it. Data stays on this device.</p>
</main>
<div id="toast" role="status"></div>
<nav role="tablist">
<button role="tab" aria-selected="true" data-tab="today">Today</button>
<button role="tab" aria-selected="false" data-tab="week">History</button>
<button role="tab" aria-selected="false" data-tab="period">Period</button>
</nav>

function unlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume()}catch(e){}}
function chime(){try{unlock();if(!AC)return;var t0=AC.currentTime,notes=[784,988,1175,1568];for(var r=0;r<3;r++)notes.forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain(),t=t0+r*1.6+i*.28;o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+1)});if(navigator.vibrate)navigator.vibrate([300,150,300,150,300])}catch(e){}}
function wake(on){try{if(on&&navigator.wakeLock&&!wl)navigator.wakeLock.request("screen").then(function(x){wl=x;x.addEventListener("release",function(){wl=null})}).catch(function(){});if(!on&&wl){wl.release();wl=null}}catch(e){}}
function anyRun(){return Object.keys(S.timers).length>0}
function toast(m){var e=document.getElementById("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},9000)}
function nameOf(k){return T.filter(function(t){return t.k==k})[0].n}
function endTimer(k,auto){var r=S.timers[k];if(!r)return;var el=(Date.now()-r.st)/60000;if(r.dur>0)el=Math.min(el,r.dur);delete S.timers[k];if(el>=1/60){var d=S.days[today]||(S.days[today]={});d[k]=Math.round(((d[k]||0)+el)*100)/100}save();if(!anyRun())wake(false);draw();if(auto){chime();toast("⏰ "+nameOf(k)+" timer finished! "+fm(el)+" min saved.")}}
function toggleTimer(k){unlock();if(S.timers[k]){endTimer(k,false);return}
var t=T.filter(function(x){return x.k==k})[0],rem=Math.ceil(goal(t)-val(today,k)),def=rem>0?rem:10;
var v=parseFloat(prompt("Timer length in minutes",def));if(!(v>0))return;
S.timers[k]={st:Date.now(),dur:v};save();wake(true);draw()}
function tdisp(k){var r=S.timers[k];if(!r)return"00:00";var el=(Date.now()-r.st)/1000;return clock(r.dur>0?Math.max(0,r.dur*60-el):el)}
function tick(){T.forEach(function(t){var r=S.timers[t.k];if(!r)return;var el=(Date.now()-r.st)/1000;if(r.dur>0&&el>=r.dur*60){endTimer(t.k,true);return}
var tot=val(today,t.k)+el/60,p=tot/goal(t),L=2*Math.PI*24;
var e=document.getElementById("tm-"+t.k);if(e)e.textContent=tdisp(t.k);
var v=document.getElementById("v-"+t.k);if(v)v.textContent=fm(tot);
var rg=document.querySelector('[data-ring="'+t.k+'"]');if(rg){rg.querySelector(".p").setAttribute("stroke-dashoffset",L*(1-Math.min(1,p)));rg.querySelector("text").textContent=Math.round(p*100)+"%"}})}
setInterval(tick,1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){tick();if(anyRun())wake(true)}});
function drawToday(){var h="",st=streak(),bs=Math.max(best(),st),d=done(today);
if(d){h+='<div class="banner"><img class="fin" src="'+FIN+'" alt=""><b>All done today! 🔥 '+st+'-day streak</b>'+(st%7==0?'<div>🎉 Milestone: '+(st/7)+' week'+(st/7>1?'s':'')+' in a row. Amazing!</div>':'<div>'+LINE+' Come back tomorrow for a fresh start.</div>')+'</div>'}
else{h+='<div class="card"><div class="sub" style="margin:0"><span>Streak: finish all 5 tasks each day</span><b>🔥 '+st+'</b></div><div class="val" style="margin-top:6px">'+cnt(today)+' of 5 done today</div></div>'}
var ch="";for(var w=1;w<=Math.floor(bs/7);w++)ch+='<span class="chip">🏅 '+(w==1?'1 week':w*7+' days')+'</span>';
var nx=(Math.floor(bs/7)+1)*7;
if(bs>0)h+='<div class="card"><div class="sub" style="margin:0"><span>Best streak</span><b>'+bs+' days</b></div>'+(ch?'<div class="chips">'+ch+'</div>':'')+'<div class="val" style="margin-top:8px">'+(st>=nx?'':(nx-st)+' more day'+(nx-st==1?'':'s')+' to your next milestone ('+nx+' days)')+'</div></div>';
T.forEach(function(t){var v=val(today,t.k),g=goal(t);
h+='<div class="card" style="--c:var('+t.c+')">'+(t.ban?'<img class="ban" src="'+t.ban+'" alt="">':'')+'<div class="head"><div class="ico">'+(t.img?'<img src="'+t.img+'" alt="">':t.e)+'</div><div><div class="title">'+t.n+'</div><div class="val"><b id="v-'+t.k+'">'+fm(v)+'</b> / <button class="gl" data-goal="'+t.k+'">'+g+' '+t.u+'</button></div></div>'+ring(v/g,t.c,t.k)+'</div><div class="btns">';
t.add.forEach(function(a){h+='<button class="b" data-k="'+t.k+'" data-n="'+a[1]+'">'+a[0]+'</button>'});
h+='<button class="b u" data-k="'+t.k+'" data-n="-'+t.undo+'" aria-label="Undo">−</button></div>';
if(t.k=="water")h+='<div class="sub"><span>Bottles (0.8 L each)</span><b>'+(Math.round(v/800*10)/10)+' of '+(Math.round(g/800*100)/100)+'</b></div>';
if(t.timer){var run=S.timers[t.k];h+='<div class="sub"><span>Timer <b id="tm-'+t.k+'">'+tdisp(t.k)+'</b></span><button class="b" data-timer="'+t.k+'" style="flex:0 0 auto;padding:8px 16px">'+(run?"■ Stop and save":"▶ Start timer")+'</button></div>'}
if(t.k=="med"){var m=medStreak();h+='<div class="sub"><span>Meditation streak</span><b>'+m+' day'+(m==1?'':'s')+'</b></div>'}
h+='</div>'});
document.getElementById("p-today").innerHTML=h}
function drawWeek(){var days=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(d)}
var h='<div class="card"><span class="title">Last 7 days</span><div class="days">'+days.map(function(d){var s=ds(d);return '<div class="'+(done(s)?'ok':'')+'"><em>'+(done(s)?'✓':cnt(s)+'/5')+'</em>'+d.toLocaleDateString("en-GB",{weekday:"short"})+'</div>'}).join("")+'</div></div>';
T.forEach(function(t){var g=goal(t),tot=0,hit=0;
var bars=days.map(function(d){var s=ds(d),v=val(s,t.k);tot+=v;if(v>=g)hit++;return '<div class="'+(v?"":"z")+'"><i style="height:'+Math.max(4,Math.min(1,v/g)*100)+'%"></i><span>'+d.toLocaleDateString("en-GB",{weekday:"narrow"})+'</span></div>'}).join("");
h+='<div class="card" style="--c:var('+t.c+')"><div class="head" style="gap:10px">'+(t.img?'<img class="hi" src="'+t.img+'" alt="">':t.ban?'<img class="hb" src="'+t.ban+'" alt="">':'<span style="font-size:26px">'+t.e+'</span>')+'<span class="title">'+t.n+'</span></div><div class="val">Goal met <b>'+hit+'</b> of 7 days · avg <b>'+Math.round(tot/7)+'</b> '+t.u+'</div><div class="wk">'+bars+'</div></div>'});
document.getElementById("p-week").innerHTML=h}
function esc(t){return t.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
var calD=new Date(),selDay=ds(new Date());calD.setDate(1);
function drawPeriod(msg){
var P=S.pdays,keys=Object.keys(P).filter(function(k){return P[k].p}).sort(),starts=[],runs=[],run=0,prev=null;
keys.forEach(function(k){var d=pd(k);if(prev&&Math.round((d-prev)/864e5)==1)run++;else{if(prev)runs.push(run);starts.push(k);run=1}prev=d});
if(prev)runs.push(run);
var cyc=0,len=5,pred={},nx=null;
if(starts.length>1){var sm=0;for(var i=1;i<starts.length;i++)sm+=(pd(starts[i])-pd(starts[i-1]))/864e5;cyc=Math.round(sm/(starts.length-1))}
if(runs.length)len=Math.max(1,Math.round(runs.reduce(function(a,b){return a+b},0)/runs.length));
if(cyc){nx=pd(starts[starts.length-1]);nx.setDate(nx.getDate()+cyc);for(var j=0;j<len;j++){var q=new Date(nx);q.setDate(q.getDate()+j);pred[ds(q)]=1}}
var h='<div class="card" style="--c:var(--per)"><div class="head"><div class="ico"><img src="'+PIMG+'" alt=""></div><span class="title">Period calendar</span></div>';
if(starts.length){var last=starts[starts.length-1],since=Math.round((pd(today)-pd(last))/864e5);h+='<div class="val" style="margin-top:8px">Last period started <b>'+fmt(last)+'</b> ('+since+' day'+(since==1?'':'s')+' ago)</div>'}
if(cyc)h+='<div class="val">Average cycle <b>'+cyc+'</b> days · next expected around <b>'+fmt(ds(nx))+'</b></div>';
else h+='<div class="val" style="margin-top:8px">Tap a date to mark your period days. After two periods, the next one is estimated.</div>';
var y=calD.getFullYear(),mo=calD.getMonth(),off=(new Date(y,mo,1).getDay()+6)%7,nd=new Date(y,mo+1,0).getDate(),g="";
["M","T","W","T","F","S","S"].forEach(function(w){g+='<div class="w">'+w+'</div>'});
for(var e=0;e<off;e++)g+='<span></span>';
for(var d=1;d<=nd;d++){var k=y+"-"+pad(mo+1)+"-"+pad(d),on=P[k]&&P[k].p,c=(on?" p":"")+(!on&&pred[k]?" pr":"")+(k==today?" td":"")+(k==selDay?" sel":"")+(P[k]&&P[k].n?" n":"");g+='<button class="'+c.trim()+'" data-day="'+k+'" aria-label="'+fmt(k)+'">'+d+'</button>'}
h+='<div class="cmh"><button data-mv="-1" aria-label="Previous month">‹</button><span>'+calD.toLocaleDateString("en-GB",{month:"long",year:"numeric"})+'</span><button data-mv="1" aria-label="Next month">›</button></div><div class="cal">'+g+'</div>';
h+='<div class="val" style="margin-top:10px"><span style="color:var(--per)">●</span> period day · dashed ring = expected · dot = has a note</div></div>';
var o=P[selDay]||{};
h+='<div class="card" style="--c:var(--per)"><span class="title">'+pd(selDay).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})+'</span><div class="btns"><button class="b" id="pmark">'+(o.p?"Remove period day":"Mark as period day")+'</button></div><label for="pn">Notes for this day (mood, symptoms, anything)</label><textarea id="pn">'+esc(o.n||"")+'</textarea><div class="btns"><button class="b" id="pnsave">Save note</button></div><div class="val" style="margin-top:10px">'+(msg||"")+'</div></div>';
var pre=y+"-"+pad(mo+1),nk=Object.keys(P).filter(function(k){return k.indexOf(pre)==0&&P[k].n}).sort();
if(nk.length){h+='<div class="card"><span class="title">Notes this month</span>';nk.forEach(function(k){h+='<div class="ent"><b>'+pd(k).toLocaleDateString("en-GB",{day:"numeric",month:"short"})+'</b><small>'+esc(P[k].n)+'</small></div>'});h+='</div>'}
document.getElementById("p-period").innerHTML=h}
function draw(){drawToday();drawWeek();if(!document.getElementById("p-period").dataset.init){drawPeriod();document.getElementById("p-period").dataset.init=1}}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
if(b.dataset.k)bump(b.dataset.k,parseInt(b.dataset.n,10));
else if(b.dataset.goal)setGoal(b.dataset.goal);
else if(b.dataset.timer)toggleTimer(b.dataset.timer);
else if(b.dataset.mv){calD.setMonth(calD.getMonth()+parseInt(b.dataset.mv,10));drawPeriod()}
else if(b.dataset.day){selDay=b.dataset.day;drawPeriod()}
else if(b.id=="pmark"){var o=S.pdays[selDay]||(S.pdays[selDay]={});if(o.p)delete o.p;else o.p=1;if(!o.p&&!o.n)delete S.pdays[selDay];save();drawPeriod()}
else if(b.id=="pnsave"){var tx=document.getElementById("pn").value.trim(),o2=S.pdays[selDay]||(S.pdays[selDay]={});if(tx)o2.n=tx;else delete o2.n;if(!o2.p&&!o2.n)delete S.pdays[selDay];save();drawPeriod("Note saved ✓")}
else if(b.dataset.tab){var tabs=["today","week","period"],names={today:"Today",week:"History",period:"Period"};
tabs.forEach(function(x){document.getElementById("p-"+x).classList.toggle("hide",x!=b.dataset.tab)});
document.querySelectorAll("nav button").forEach(function(n){n.setAttribute("aria-selected",n===b)});
document.getElementById("hi").textContent=names[b.dataset.tab];document.getElementById("hint").classList.toggle("hide",b.dataset.tab!="today");window.scrollTo(0,0)}});
draw();tick();
</script>
</body>
